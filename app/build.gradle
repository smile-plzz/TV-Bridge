plugins { id 'com.android.application' }
android {
    namespace 'io.github.smileplzz.tvbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.smileplzz.tvbridge'
        minSdk 26
        targetSdk 35
        versionCode 11000
        versionName '1.1.0'
        testInstrumentationRunner 'io.github.smileplzz.tvbridge.BridgeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            storeFile file(System.getenv('TVBRIDGE_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword System.getenv('TVBRIDGE_STORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('TVBRIDGE_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('TVBRIDGE_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
