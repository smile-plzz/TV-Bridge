plugins { id 'com.android.application' }
android {
    namespace 'io.github.smileplzz.tvbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.smileplzz.tvbridge'
        minSdk 26
        targetSdk 35
        versionCode 10000
        versionName '1.0.0'
        testInstrumentationRunner 'io.github.smileplzz.tvbridge.BridgeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
