name: Build, verify and ship
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tv-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tv-bridge-preview-signing-v1
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Protocol and QR checks
        run: |
          mkdir -p test-classes
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d test-classes app/src/main/java/io/github/smileplzz/tvbridge/{HttpWire,QrCode}.java tests/{ProtocolTest,QrDump}.java
          java -cp test-classes io.github.smileplzz.tvbridge.ProtocolTest
          pip install segno==1.6.6
          python tests/check_qr.py "test-classes:$ANDROID_HOME/platforms/android-35/android.jar"
          node --check app/src/main/assets/app.js
      - name: Build and lint
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TV-Bridge-1.0.0-preview.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/TV-Bridge-tests.apk
          cd dist
          sha256sum TV-Bridge-1.0.0-preview.apk > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs TV-Bridge-1.0.0-preview.apk > SIGNING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tv-bridge-build
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
  device-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: tv-bridge-build
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android transfer integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r dist/TV-Bridge-1.0.0-preview.apk
            adb install -r dist/TV-Bridge-tests.apk
            adb shell am instrument -w io.github.smileplzz.tvbridge.test/io.github.smileplzz.tvbridge.BridgeInstrumentation | tee device-results.txt
            grep -q TV_BRIDGE_TESTS_OK device-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results
          path: device-results.txt
  publish:
    if: github.event_name != 'pull_request'
    needs: [build, device-tests]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tv-bridge-build
          path: dist
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-preview.${{ github.run_number }}"
          gh release create "$TAG" dist/TV-Bridge-1.0.0-preview.apk dist/SHA256SUMS.txt dist/SIGNING.txt --target "$GITHUB_SHA" --title "TV Bridge 1.0.0 — Preview ${{ github.run_number }}" --prerelease --notes-file docs/RELEASE-NOTES.md
