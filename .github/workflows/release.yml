name: Build, verify and ship
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tv-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Protocol and QR checks
        run: |
          mkdir -p test-classes
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d test-classes app/src/main/java/io/github/smileplzz/tvbridge/{HttpWire,QrCode,UploadStore}.java tests/{ProtocolTest,QrDump,UploadStoreTest}.java
          java -cp test-classes io.github.smileplzz.tvbridge.ProtocolTest
          java -cp test-classes io.github.smileplzz.tvbridge.UploadStoreTest
          pip install qrcode==8.2
          python tests/check_qr.py "test-classes:$ANDROID_HOME/platforms/android-35/android.jar"
          node --check app/src/main/assets/app.js
          node tests/browser-identity.test.cjs
      - name: Build and lint
        run: |
          gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
          gradle --no-daemon assembleRelease lintRelease
      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TV-Bridge-test-target.apk
          cp app/build/outputs/apk/release/app-release.apk dist/TV-Bridge-1.1.0-candidate.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/TV-Bridge-tests.apk
          cd dist
          sha256sum TV-Bridge-1.1.0-candidate.apk > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs TV-Bridge-1.1.0-candidate.apk > SIGNING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tv-bridge-build
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
  device-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: tv-bridge-build
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android transfer integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r dist/TV-Bridge-test-target.apk
            adb install -r dist/TV-Bridge-tests.apk
            adb shell am instrument -w io.github.smileplzz.tvbridge.test/io.github.smileplzz.tvbridge.BridgeInstrumentation | tee device-results.txt
            grep -q TV_BRIDGE_TESTS_OK device-results.txt
            adb pull /sdcard/Android/data/io.github.smileplzz.tvbridge/files/tv-home.png tv-home.png
            adb install -r dist/TV-Bridge-1.1.0-candidate.apk
            adb shell am start -W -n io.github.smileplzz.tvbridge/.MainActivity
            adb shell pidof io.github.smileplzz.tvbridge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results
          path: |
            device-results.txt
            tv-home.png
  publish:
    if: github.event_name != 'pull_request'
    needs: [build, device-tests]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tv-bridge-build
          path: dist
      - name: Prepare draft for private production signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.0"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "TV Bridge 1.1.0" --notes-file docs/RELEASE-NOTES.md
